opencollection: 1.0.0

info:
  name: expenses
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: apikey
    key: session_id
    value: dedba2e9-d116-4340-a0ae-8dcc9020cae3
    placement: header
  variables:
    - name: url
      value: http://localhost:8088
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git

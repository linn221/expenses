info:
  name: costPerspectivesCreate
  type: http

http:
  method: POST
  url: "{{url}}/cost-perspectives"
  body:
    type: json
    data: |-
      {
        "name": "markup",
        "value": "15",
        "type": "percentage",
        "applications": [
          {
            "money_insight_category": ["expense", "daily_expense"],
            "starting_value": "1000"
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

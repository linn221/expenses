info:
  name: itemsCreate
  type: http

http:
  method: POST
  url: "{{url}}/items"
  body:
    type: json
    data: |-
      {
        "name": "latte",
        "code": "latte",
        "price": "3500",
        "category_id": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

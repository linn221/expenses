info:
  name: incomesCreate
  type: http

http:
  method: POST
  url: "{{url}}/incomes"
  body:
    type: json
    data: |-
      {
        "title": "salary",
        "amount": "500000",
        "income_date": "2026-10-28",
        "wallet_id": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
